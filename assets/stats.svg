<svg width="600" height="190" viewBox="0 0 600 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">At a glance</title>
  <desc id="d">17 stars earned, 12 public repositories, 7 followers, 4 featured projects.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="600" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101830"/>
      <stop offset="1" stop-color="#0B1122"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1" fill="#8E9BFF" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="600" height="190" rx="18" fill="url(#card)"/>
  <rect width="600" height="190" rx="18" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="598.5" height="188.5" rx="17.25" stroke="#222D4D" stroke-width="1.5"/>

  <g font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="32" y="48" font-size="19" font-weight="700" fill="#F4EFE6" letter-spacing="-0.3">At a glance</text>
    <text x="568" y="48" text-anchor="end" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="10" fill="#6F7A9E" letter-spacing="0.6">OCT 2026</text>
  </g>

  <g stroke="#222D4D" stroke-width="1">
    <line x1="166" y1="102" x2="166" y2="158"/>
    <line x1="300" y1="102" x2="300" y2="158"/>
    <line x1="434" y1="102" x2="434" y2="158"/>
  </g>

  <g font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="99" y="132" font-size="36" font-weight="700" fill="#FF8E7A" letter-spacing="-1">17</text>
    <text x="99" y="156" font-size="11" fill="#8A93AD">stars earned</text>

    <text x="233" y="132" font-size="36" font-weight="700" fill="#F4EFE6" letter-spacing="-1">12</text>
    <text x="233" y="156" font-size="11" fill="#8A93AD">public repos</text>

    <text x="367" y="132" font-size="36" font-weight="700" fill="#F4EFE6" letter-spacing="-1">7</text>
    <text x="367" y="156" font-size="11" fill="#8A93AD">followers</text>

    <text x="501" y="132" font-size="36" font-weight="700" fill="#F4EFE6" letter-spacing="-1">4</text>
    <text x="501" y="156" font-size="11" fill="#8A93AD">featured projects</text>
  </g>
</svg>
