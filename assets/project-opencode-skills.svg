<svg width="600" height="300" viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">opencode-skills — reusable workflows for an AI coding agent</title>
  <desc id="d">Dark card with a terminal running skill commands and a list of skills; Markdown, Node.js, OpenCode.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="600" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101830"/>
      <stop offset="1" stop-color="#0B1122"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8E7A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF8E7A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1" fill="#8E9BFF" opacity="0.1"/>
    </pattern>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="600" height="300" rx="18" fill="url(#card)"/>
  <rect width="600" height="300" rx="18" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="598.5" height="298.5" rx="17.25" stroke="#222D4D" stroke-width="1.5"/>

  <ellipse cx="470" cy="140" rx="80" ry="70" fill="url(#warm)" filter="url(#soft)"/>

  <rect x="356" y="100" width="212" height="172" rx="14" fill="#0D1528" stroke="#2A3557"/>
  <line x1="356" y1="130" x2="568" y2="130" stroke="#1E2844" stroke-width="1.4"/>
  <circle cx="370" cy="115" r="4" fill="#3A4668"/>
  <circle cx="384" cy="115" r="4" fill="#3A4668"/>
  <circle cx="398" cy="115" r="4" fill="#3A4668"/>

  <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="10.5">
    <text x="370" y="150" fill="#5B6A96"># load a skill</text>
    <text x="370" y="166" fill="#8E9BFF">@code-review</text>
    <text x="462" y="166" fill="#6E7BA3">this diff</text>
  </g>

  <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="10.5">
    <rect x="366" y="180" width="192" height="20" rx="6" fill="#101A33"/>
    <rect x="366" y="180" width="3" height="20" rx="1.5" fill="#FF8E7A"/>
    <text x="376" y="194" fill="#F4EFE6">code-review</text>
    <rect x="366" y="204" width="192" height="20" rx="6" fill="#101A33"/>
    <text x="376" y="218" fill="#A8B2D1">git-release</text>
    <rect x="366" y="228" width="192" height="20" rx="6" fill="#101A33"/>
    <text x="376" y="242" fill="#A8B2D1">security-audit</text>
  </g>

  <circle cx="540" cy="190" r="2.5" fill="#8E9BFF" opacity="0.8"/>

  <g font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="32" y="50" font-size="13" fill="#8A93AD" letter-spacing="0.3">AI tooling</text>
    <text x="30" y="196" font-size="38" font-weight="700" fill="#F4EFE6" letter-spacing="-1.2">opencode-skills</text>
    <text x="32" y="228" font-size="16" fill="#A8B2D1">Reusable skills for an AI agent.</text>
    <text x="32" y="262" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" fill="#FF8E7A" letter-spacing="0.2">Markdown · Node.js · OpenCode</text>
  </g>
</svg>
