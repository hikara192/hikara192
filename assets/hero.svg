<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">hikara192 — developer from Belarus</title>
  <desc id="heroDesc">Night-blue banner with an orbit diagram: macOS tools, Flutter apps, and small worlds made in Godot.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="0.58" stop-color="#0C1428"/>
      <stop offset="1" stop-color="#101A33"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6B7CFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6B7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="salmonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8E7A" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FF8E7A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="906" y1="144" x2="966" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9B4FF"/>
      <stop offset="1" stop-color="#4C5BD4"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#8E9BFF" opacity="0.16"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <style>
      .star { animation: twinkle 5.5s ease-in-out infinite; }
      .orbit-a { transform-origin: 940px 180px; animation: spin 26s linear infinite; }
      .orbit-b { transform-origin: 940px 180px; animation: spin 42s linear infinite reverse; }
      .aurora { animation: drift 18s ease-in-out infinite alternate; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.18; }
        50% { opacity: 0.85; }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes drift {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(-18px, 10px, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .star, .orbit-a, .orbit-b, .aurora { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#dots)"/>
  <ellipse class="aurora" cx="985" cy="110" rx="330" ry="250" fill="url(#blueGlow)" filter="url(#blur)"/>
  <ellipse class="aurora" cx="120" cy="380" rx="290" ry="190" fill="url(#salmonGlow)" filter="url(#blur)"/>

  <g fill="#C9D1FF">
    <circle class="star" cx="704" cy="58" r="1.6"/>
    <circle class="star" cx="760" cy="104" r="1.1" style="animation-delay:-1.8s"/>
    <circle class="star" cx="826" cy="48" r="1.4" style="animation-delay:-3.1s"/>
    <circle class="star" cx="892" cy="92" r="1" style="animation-delay:-0.9s"/>
    <circle class="star" cx="1010" cy="54" r="1.7" style="animation-delay:-2.4s"/>
    <circle class="star" cx="1078" cy="96" r="1.1" style="animation-delay:-4.2s"/>
    <circle class="star" cx="1120" cy="176" r="1.4" style="animation-delay:-1.2s"/>
    <circle class="star" cx="1036" cy="284" r="1.2" style="animation-delay:-3.6s"/>
    <circle class="star" cx="760" cy="312" r="1.3" style="animation-delay:-2.7s"/>
    <circle class="star" cx="664" cy="212" r="1" style="animation-delay:-0.4s"/>
    <circle class="star" cx="612" cy="96" r="1.2" style="animation-delay:-4.8s"/>
    <circle class="star" cx="1148" cy="248" r="1" style="animation-delay:-2.1s"/>
  </g>

  <g font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="104" font-size="16" fill="#FF8E7A" letter-spacing="0.2">Developer from Belarus</text>
    <text x="68" y="204" font-size="102" font-weight="800" fill="#F4EFE6" letter-spacing="-4.5">hikara192</text>
    <text x="72" y="252" font-size="21" fill="#A8B2D1">macOS tools, Flutter apps, and small</text>
    <text x="72" y="280" font-size="21" fill="#A8B2D1">worlds made in Godot.</text>
    <g font-size="14" fill="#7C87AA">
      <text x="72" y="334">Vitebsk, Belarus</text>
      <line x1="196" y1="322" x2="196" y2="338" stroke="#2A3557" stroke-width="1"/>
      <text x="212" y="334">HBG TEAM</text>
      <line x1="301" y1="322" x2="301" y2="338" stroke="#2A3557" stroke-width="1"/>
      <text x="317" y="334">t.me/hbgdev</text>
    </g>
  </g>

  <g>
    <circle cx="940" cy="180" r="150" stroke="#2C3A66" stroke-width="1" stroke-dasharray="2 10"/>
    <circle cx="940" cy="180" r="106" stroke="#26325A" stroke-width="1"/>
    <circle cx="940" cy="180" r="64" stroke="#2C3A66" stroke-width="1"/>

    <g stroke="#2C3A66" stroke-width="1">
      <line x1="940" y1="24" x2="940" y2="34"/>
      <line x1="940" y1="326" x2="940" y2="336"/>
      <line x1="784" y1="180" x2="794" y2="180"/>
      <line x1="1086" y1="180" x2="1096" y2="180"/>
    </g>

    <circle cx="940" cy="180" r="34" fill="url(#moon)"/>
    <circle cx="930" cy="168" r="30" fill="#C3CBFF" opacity="0.14"/>

    <g class="orbit-a">
      <circle cx="1046" cy="180" r="4.5" fill="#FF8E7A"/>
      <circle cx="1046" cy="180" r="11" fill="#FF8E7A" opacity="0.14"/>
    </g>
    <g class="orbit-b">
      <circle cx="940" cy="74" r="3" fill="#F4EFE6"/>
      <circle cx="940" cy="74" r="8" fill="#F4EFE6" opacity="0.1"/>
    </g>

    <text x="940" y="356" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" fill="#6F7A9E" letter-spacing="2">55.19° N   30.20° E</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="379" stroke="#1C2745" stroke-width="1"/>
</svg>
