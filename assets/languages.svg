<svg width="600" height="240" viewBox="0 0 600 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Languages I write</title>
  <desc id="d">Share of code across public repositories: GDScript 62%, Dart 25%, Swift 10%, Java 2%, other 1%.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="600" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101830"/>
      <stop offset="1" stop-color="#0B1122"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1" fill="#8E9BFF" opacity="0.1"/>
    </pattern>
    <clipPath id="bar">
      <rect x="32" y="96" width="536" height="16" rx="8"/>
    </clipPath>
  </defs>

  <rect width="600" height="240" rx="18" fill="url(#card)"/>
  <rect width="600" height="240" rx="18" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="598.5" height="238.5" rx="17.25" stroke="#222D4D" stroke-width="1.5"/>

  <g font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="32" y="48" font-size="19" font-weight="700" fill="#F4EFE6" letter-spacing="-0.3">Languages I write</text>
    <text x="32" y="68" font-size="12" fill="#8A93AD">Share of code across public repositories</text>
    <text x="568" y="48" text-anchor="end" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="10" fill="#6F7A9E" letter-spacing="0.6">OCT 2026</text>
  </g>

  <rect x="32" y="96" width="536" height="16" rx="8" fill="#26325A"/>
  <g clip-path="url(#bar)">
    <rect x="32" y="96" width="332" height="16" fill="#FF8E7A"/>
    <rect x="364" y="96" width="134" height="16" fill="#6B7CFF"/>
    <rect x="498" y="96" width="54" height="16" fill="#8E9BFF"/>
    <rect x="552" y="96" width="11" height="16" fill="#3F4F8F"/>
    <rect x="563" y="96" width="5" height="16" fill="#3A466E"/>
  </g>

  <g font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
    <circle cx="35" cy="148" r="4" fill="#FF8E7A"/>
    <text x="48" y="152" fill="#D9DEEF">GDScript</text>
    <text x="128" y="152" fill="#7C87AA" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11">62%</text>

    <circle cx="305" cy="148" r="4" fill="#6B7CFF"/>
    <text x="318" y="152" fill="#D9DEEF">Dart</text>
    <text x="380" y="152" fill="#7C87AA" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11">25%</text>

    <circle cx="35" cy="180" r="4" fill="#8E9BFF"/>
    <text x="48" y="184" fill="#D9DEEF">Swift</text>
    <text x="128" y="184" fill="#7C87AA" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11">10%</text>

    <circle cx="305" cy="180" r="4" fill="#3F4F8F"/>
    <text x="318" y="184" fill="#D9DEEF">Java</text>
    <text x="380" y="184" fill="#7C87AA" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11">2%</text>

    <circle cx="35" cy="212" r="4" fill="#3A466E"/>
    <text x="48" y="216" fill="#D9DEEF">Other</text>
    <text x="128" y="216" fill="#7C87AA" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11">1%</text>
  </g>
</svg>
