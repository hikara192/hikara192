<svg width="600" height="300" viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">VSTU HOME — a Flutter app for VSTU students</title>
  <desc id="d">Dark card with a phone showing a schedule; Dart, Flutter, Android.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="600" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101830"/>
      <stop offset="1" stop-color="#0B1122"/>
    </linearGradient>
    <radialGradient id="blueglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6B7CFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6B7CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1" fill="#8E9BFF" opacity="0.1"/>
    </pattern>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="600" height="300" rx="18" fill="url(#card)"/>
  <rect width="600" height="300" rx="18" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="598.5" height="298.5" rx="17.25" stroke="#222D4D" stroke-width="1.5"/>

  <ellipse cx="492" cy="110" rx="90" ry="85" fill="url(#blueglow)" filter="url(#soft)"/>

  <rect x="430" y="50" width="124" height="182" rx="24" fill="#0B1224" stroke="#2B3860" stroke-width="1.5"/>
  <rect x="438" y="58" width="108" height="166" rx="18" fill="#0E1830"/>
  <rect x="478" y="65" width="28" height="5" rx="2.5" fill="#1A2440"/>

  <text x="452" y="94" font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#F4EFE6" letter-spacing="0.2">VSTU</text>
  <circle cx="530" cy="90" r="3" fill="#FF8E7A"/>

  <g>
    <rect x="452" y="106" width="18" height="5" rx="2.5" fill="#FF8E7A"/>
    <rect x="474" y="106" width="18" height="5" rx="2.5" fill="#26325A"/>
    <rect x="496" y="106" width="18" height="5" rx="2.5" fill="#26325A"/>
    <rect x="518" y="106" width="18" height="5" rx="2.5" fill="#26325A"/>
  </g>

  <g>
    <circle cx="452" cy="130" r="2.2" fill="#FF8E7A"/>
    <rect x="460" y="126" width="60" height="8" rx="4" fill="#2C3A62"/>
    <circle cx="452" cy="152" r="2.2" fill="#6B7CFF"/>
    <rect x="460" y="148" width="44" height="8" rx="4" fill="#24325A"/>
    <circle cx="452" cy="174" r="2.2" fill="#6B7CFF"/>
    <rect x="460" y="170" width="70" height="8" rx="4" fill="#24325A"/>
    <circle cx="452" cy="196" r="2.2" fill="#6B7CFF"/>
    <rect x="460" y="192" width="52" height="8" rx="4" fill="#24325A"/>
  </g>

  <g fill="#26325A">
    <circle cx="474" cy="212" r="2"/>
    <circle cx="492" cy="212" r="2" fill="#FF8E7A"/>
    <circle cx="510" cy="212" r="2"/>
  </g>

  <g font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="32" y="50" font-size="13" fill="#8A93AD" letter-spacing="0.3">Flutter app</text>
    <text x="30" y="212" font-size="38" font-weight="700" fill="#F4EFE6" letter-spacing="-1.2">VSTU HOME</text>
    <text x="32" y="244" font-size="17" fill="#A8B2D1">Schedules, groups, and Moodle in one app.</text>
    <text x="32" y="274" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" fill="#FF8E7A" letter-spacing="0.2">Dart · Flutter · private project</text>
  </g>
</svg>
